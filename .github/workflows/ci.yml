name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: lint, type-check, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: uv run pytest

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Type-check with mypy
        run: uv run mypy

      - name: Validate experiment registry
        run: uv run python scripts/validate_experiment_registry.py docs/experiment_registry.json

      - name: Validate solution knowledge
        run: uv run python scripts/validate_solution_knowledge.py docs/solution_knowledge.json

      - name: Validate results ledger
        run: uv run python scripts/validate_results_ledger.py docs/results_ledger.json

      - name: Check the rendered results doc is in sync
        run: uv run python scripts/render_results_ledger.py --check

      # The evaluation artifacts are gitignored because they total about 196 MB, so CI
      # cannot re-hash them. The manifest's registry cross-check needs no artifact bytes
      # and still runs; artifacts absent from disk are counted, not failed.
      - name: Verify the artifact manifest against the registry
        run: uv run python scripts/verify_artifact_manifest.py

      - name: Validate phase 3 evidence and sealed-scenario policy
        run: uv run python scripts/validate_phase3_evidence.py

      # Agent traces live under the gitignored .context/ directory, so they are not
      # present in CI and are validated locally instead.
