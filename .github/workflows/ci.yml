name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: lint, type-check, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: uv run pytest

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Type-check with mypy
        run: uv run mypy

      - name: Validate experiment registry
        run: uv run python scripts/validate_experiment_registry.py docs/experiment_registry.json

      - name: Validate solution knowledge
        run: uv run python scripts/validate_solution_knowledge.py docs/solution_knowledge.json
