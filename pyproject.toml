[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegistrace"
version = "0.1.0"
description = "Evidence-grounded AI security triage research platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "AegisTrace contributors" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
    "pyarrow>=18,<23",
    "pydantic>=2.11,<3",
    "scikit-learn>=1.6,<2",
]

#: The local UI is an OPTIONAL extra, deliberately. The research library must never depend on a web
#: server: detection, triage, tiering and review all work headless, and a reader who only wants the
#: library should not install a server to get it. `pip install -e '.[ui]'`.
[project.optional-dependencies]
storage = [
  "duckdb>=1.1,<2",
]
ui = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aegistrace"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=aegistrace --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["aegistrace"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "sklearn", "sklearn.*", "fastapi", "fastapi.*", "starlette", "starlette.*", "uvicorn", "uvicorn.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
